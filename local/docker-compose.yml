name: multicloud-local

services:
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: multicloud
      MONGO_INITDB_ROOT_PASSWORD: local-only-mongodb
    ports:
      - "${MONGODB_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--username", "multicloud", "--password", "local-only-mongodb", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  floci-aws:
    image: ${FLOCI_AWS_IMAGE:-floci/floci:latest}
    ports:
      - "${FLOCI_AWS_HOST_PORT:-14566}:4566"
    volumes:
      - floci-aws-data:/app/data

  floci-azure:
    image: ${FLOCI_AZURE_IMAGE:-floci/floci-az:latest}
    ports:
      - "4577:4577"

  floci-gcp:
    image: ${FLOCI_GCP_IMAGE:-floci/floci-gcp:latest}
    ports:
      - "4588:4588"

  app-aws:
    build:
      context: ..
      args:
        APP_VERSION: local
    environment:
      CLOUD_PROVIDER: aws
      CLOUD_REGION: ap-south-1
      MONGODB_URI: ${MONGODB_URI:-mongodb://multicloud:local-only-mongodb@mongodb:27017/?authSource=admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-multicloud_demo}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8081:8080"

  app-azure:
    build:
      context: ..
      args:
        APP_VERSION: local
    environment:
      CLOUD_PROVIDER: azure
      CLOUD_REGION: centralindia
      MONGODB_URI: ${MONGODB_URI:-mongodb://multicloud:local-only-mongodb@mongodb:27017/?authSource=admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-multicloud_demo}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8082:8080"

  app-gcp:
    build:
      context: ..
      args:
        APP_VERSION: local
    environment:
      CLOUD_PROVIDER: gcp
      CLOUD_REGION: asia-south1
      MONGODB_URI: ${MONGODB_URI:-mongodb://multicloud:local-only-mongodb@mongodb:27017/?authSource=admin}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-multicloud_demo}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "8083:8080"

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      - app-aws
      - app-azure
      - app-gcp
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  mongodb-data:
  floci-aws-data:
  prometheus-data:
  grafana-data:
