name: multicloud-local

services:
  floci-aws:
    image: ${FLOCI_AWS_IMAGE:-floci/floci:latest}
    ports:
      - "${FLOCI_AWS_HOST_PORT:-14566}:4566"
    volumes:
      - floci-aws-data:/app/data

  floci-azure:
    image: ${FLOCI_AZURE_IMAGE:-floci/floci-az:latest}
    ports:
      - "4577:4577"

  floci-gcp:
    image: ${FLOCI_GCP_IMAGE:-floci/floci-gcp:latest}
    ports:
      - "4588:4588"

  app-aws:
    build:
      context: ..
      args:
        APP_VERSION: local
    environment:
      CLOUD_PROVIDER: aws
      CLOUD_REGION: ap-south-1
    ports:
      - "8081:8080"

  app-azure:
    build:
      context: ..
      args:
        APP_VERSION: local
    environment:
      CLOUD_PROVIDER: azure
      CLOUD_REGION: centralindia
    ports:
      - "8082:8080"

  app-gcp:
    build:
      context: ..
      args:
        APP_VERSION: local
    environment:
      CLOUD_PROVIDER: gcp
      CLOUD_REGION: asia-south1
    ports:
      - "8083:8080"

  gateway:
    image: nginx:1.29-alpine
    depends_on:
      - app-aws
      - app-azure
      - app-gcp
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: local-only-change-me
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  floci-aws-data:
  prometheus-data:
  grafana-data:
