events {}

http {
  upstream multicloud_apps {
    zone multicloud_apps 64k;
    server app-aws:8080 max_fails=2 fail_timeout=10s;
    server app-azure:8080 max_fails=2 fail_timeout=10s;
    server app-gcp:8080 max_fails=2 fail_timeout=10s;
  }

  server {
    listen 80;

    location = /gateway-health {
      access_log off;
      return 200 'healthy\n';
    }

    location / {
      proxy_pass http://multicloud_apps;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    }
  }
}

